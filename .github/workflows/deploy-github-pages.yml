name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        # Sem --frozen-lockfile: evita falha quando o lockfile foi gerado
        # por outra versão do Bun.
        run: bun install --no-save

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Habilita o GitHub Pages automaticamente se ainda não estiver ativo.
          enablement: true

      - name: Definir caminho base
        id: base
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # base_path vem como "/repo" (ou vazio em usuario.github.io).
          # Normaliza para sempre terminar com uma única "/".
          base="${BASE_PATH:-/}"
          base="/${base#/}"
          base="${base%/}/"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Base do site: $base"

      - name: Gerar site estático
        env:
          GH_PAGES_BASE: ${{ steps.base.outputs.base }}
        run: bun run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
