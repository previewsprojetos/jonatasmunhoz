name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Gerar site estático
        env:
          # Em repositórios "usuario.github.io" o base é "/".
          # Em qualquer outro repositório o base é "/nome-do-repositorio/".
          GH_PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
        run: bun run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
